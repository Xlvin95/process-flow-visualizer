<!DOCTYPE html>
<html>
<head>
    <title>Process Flow visualizer</title>
    <link rel="stylesheet" href="style.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container">
    <h1>Process Flow visualizer</h1>

    <div class="cards">
        <div class="card">
            <h2>CPU Usage</h2>
            <p id="cpu">0%</p>
        </div>

        <div class="card">
            <h2>Memory Usage</h2>
            <p id="memory">0%</p>
        </div>

        <div class="card">
            <h2>Network</h2>
            <p id="network">0 Mbps</p>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="chart"></canvas>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
