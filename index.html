<!DOCTYPE html>
<html>
<head>
    <title>DevOps Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>🚀 DevOps Monitoring Dashboard</h1>

    <div class="cards">
        <div class="card">
            <h2>CPU Usage</h2>
            <p id="cpu">0%</p>
        </div>

        <div class="card">
            <h2>Memory Usage</h2>
            <p id="memory">0%</p>
        </div>

        <div class="card">
            <h2>Network</h2>
            <p id="network">0 Mbps</p>
        </div>
    </div>

    <canvas id="chart"></canvas>
</div>

<script src="script.js"></script>
</body>
</html>
